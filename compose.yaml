# Runs the system locally.
#   cp .env.example .env    # then set the passwords
#   docker compose up --build
# To open it from a phone or another computer on the same network, set PUBLIC_HOST in .env to this
# computer's address on that network, such as 192.168.0.41. Sign-in then goes to that address.
# For HTTPS on that address, see "HTTPS" in README.md: the profile "https" adds a proxy in front.

name: car-rental

# Where every service checks tokens: keys from Keycloak's internal address, the issuer at the
# address of the browser.
x-token-checks: &token-checks
  CAR_RENTAL_SECURITY_KEYCLOAK_URL: http://keycloak:8080
  CAR_RENTAL_SECURITY_KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://${PUBLIC_HOST:-localhost}:8180}

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?Set INVENTORY_DB_PASSWORD in .env}
      RESERVATION_DB_PASSWORD: ${RESERVATION_DB_PASSWORD:?Set RESERVATION_DB_PASSWORD in .env}
      ADMINISTRATION_DB_PASSWORD: ${ADMINISTRATION_DB_PASSWORD:?Set ADMINISTRATION_DB_PASSWORD in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD:?Set CUSTOMER_DB_PASSWORD in .env}
      PRICING_DB_PASSWORD: ${PRICING_DB_PASSWORD:?Set PRICING_DB_PASSWORD in .env}
      ANCILLARY_DB_PASSWORD: ${ANCILLARY_DB_PASSWORD:?Set ANCILLARY_DB_PASSWORD in .env}
      INSURANCE_DB_PASSWORD: ${INSURANCE_DB_PASSWORD:?Set INSURANCE_DB_PASSWORD in .env}
      DISCOUNT_DB_PASSWORD: ${DISCOUNT_DB_PASSWORD:?Set DISCOUNT_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.2.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12

  redis:
    image: redis:8.10-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Sign-in. The browser reaches it at KEYCLOAK_PUBLIC_URL, by default PUBLIC_HOST:8180, and the
  # gateways at keycloak:8080. Tokens name the browser's address as their issuer.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://${PUBLIC_HOST:-localhost}:8180}
      # Behind the HTTPS proxy, Keycloak learns from its headers that the browser used HTTPS.
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      ADMIN_GATEWAY_CLIENT_SECRET: ${ADMIN_GATEWAY_CLIENT_SECRET:?Set ADMIN_GATEWAY_CLIENT_SECRET in .env}
      CUSTOMER_GATEWAY_CLIENT_SECRET: ${CUSTOMER_GATEWAY_CLIENT_SECRET:?Set CUSTOMER_GATEWAY_CLIENT_SECRET in .env}
      KEYCLOAK_TEST_USER_PASSWORD: ${KEYCLOAK_TEST_USER_PASSWORD:?Set KEYCLOAK_TEST_USER_PASSWORD in .env}
      # Where the UIs return after sign-in, besides localhost; read when the realm is first imported.
      CUSTOMER_UI_URL: ${CUSTOMER_UI_URL:-http://${PUBLIC_HOST:-localhost}:8080}
      ADMIN_UI_URL: ${ADMIN_UI_URL:-http://${PUBLIC_HOST:-localhost}:8090}
      INVENTORY_SERVICE_CLIENT_SECRET: ${INVENTORY_SERVICE_CLIENT_SECRET:?Set INVENTORY_SERVICE_CLIENT_SECRET in .env}
      RESERVATION_SERVICE_CLIENT_SECRET: ${RESERVATION_SERVICE_CLIENT_SECRET:?Set RESERVATION_SERVICE_CLIENT_SECRET in .env}
      SEARCH_SERVICE_CLIENT_SECRET: ${SEARCH_SERVICE_CLIENT_SECRET:?Set SEARCH_SERVICE_CLIENT_SECRET in .env}
      CACHE_UPDATER_CLIENT_SECRET: ${CACHE_UPDATER_CLIENT_SECRET:?Set CACHE_UPDATER_CLIENT_SECRET in .env}
      PRICING_SERVICE_CLIENT_SECRET: ${PRICING_SERVICE_CLIENT_SECRET:?Set PRICING_SERVICE_CLIENT_SECRET in .env}
      ANCILLARY_SERVICE_CLIENT_SECRET: ${ANCILLARY_SERVICE_CLIENT_SECRET:?Set ANCILLARY_SERVICE_CLIENT_SECRET in .env}
      INSURANCE_SERVICE_CLIENT_SECRET: ${INSURANCE_SERVICE_CLIENT_SECRET:?Set INSURANCE_SERVICE_CLIENT_SECRET in .env}
      DISCOUNT_SERVICE_CLIENT_SECRET: ${DISCOUNT_SERVICE_CLIENT_SECRET:?Set DISCOUNT_SERVICE_CLIENT_SECRET in .env}
      # Optional: without a Google application, customers sign in as the test user.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-not-configured}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-not-configured}
    volumes:
      - ./infra/keycloak/car-rental-realm.json:/opt/keycloak/data/import/car-rental-realm.json:ro
    ports:
      - "8180:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl or wget. Keycloak reports ready while it still bootstraps and refuses
      # token requests with 503, so the check waits until the realm itself answers.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/8080 &&
          printf 'GET /realms/car-rental/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

  # The gateway of the customer UI.
  gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: customer
      REDIS_HOST: redis
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://${PUBLIC_HOST:-localhost}:8180}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      GATEWAY_CLIENT_SECRET: ${CUSTOMER_GATEWAY_CLIENT_SECRET:?Set CUSTOMER_GATEWAY_CLIENT_SECRET in .env}
      LOCATION_INFO_URL: http://location-info-service:8080
      CAR_TYPE_INFO_URL: http://car-type-info-service:8080
      SEARCH_URL: http://search-service:8080
      CUSTOMER_URL: http://customer-service:8080
      PRICING_URL: http://pricing-service:8080
      ANCILLARY_URL: http://ancillary-service:8080
      INSURANCE_URL: http://insurance-service:8080
      RESERVATION_URL: http://reservation-service:8080
    ports:
      - "8087:8080"
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  # The gateway of the admin UI.
  admin-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: admin
      REDIS_HOST: redis
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://${PUBLIC_HOST:-localhost}:8180}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      GATEWAY_CLIENT_SECRET: ${ADMIN_GATEWAY_CLIENT_SECRET:?Set ADMIN_GATEWAY_CLIENT_SECRET in .env}
      ADMINISTRATION_URL: http://administration-service:8080
      INVENTORY_URL: http://inventory-service:8080
      PRICING_URL: http://pricing-service:8080
      ANCILLARY_URL: http://ancillary-service:8080
      DISCOUNT_URL: http://discount-service:8080
      RESERVATION_URL: http://reservation-service:8080
    ports:
      - "8088:8080"
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  cache-updater:
    build:
      context: .
      dockerfile: services/cache-updater/Dockerfile
    environment:
      <<: *token-checks
      CAR_RENTAL_SECURITY_CLIENT_ID: cache-updater
      CAR_RENTAL_SECURITY_CLIENT_SECRET: ${CACHE_UPDATER_CLIENT_SECRET:?Set CACHE_UPDATER_CLIENT_SECRET in .env}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ADMINISTRATION_URL: http://administration-service:8080
    depends_on:
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      administration-service:
        condition: service_healthy

  location-info-service:
    build:
      context: .
      dockerfile: services/info-services/location/Dockerfile
    environment:
      <<: *token-checks
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy

  car-type-info-service:
    build:
      context: .
      dockerfile: services/info-services/car-type/Dockerfile
    environment:
      <<: *token-checks
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy

  administration-service:
    build:
      context: .
      dockerfile: services/administration-service/app/Dockerfile
    environment:
      <<: *token-checks
      DB_URL: jdbc:postgresql://postgres:5432/administration
      DB_USER: administration
      DB_PASSWORD: ${ADMINISTRATION_DB_PASSWORD:?Set ADMINISTRATION_DB_PASSWORD in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ADMINISTRATION_SEED_DATA: "true"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  search-service:
    build:
      context: .
      dockerfile: services/search-service/app/Dockerfile
    environment:
      <<: *token-checks
      CAR_RENTAL_SECURITY_CLIENT_ID: search-service
      CAR_RENTAL_SECURITY_CLIENT_SECRET: ${SEARCH_SERVICE_CLIENT_SECRET:?Set SEARCH_SERVICE_CLIENT_SECRET in .env}
      LOCATION_INFO_URL: http://location-info-service:8080
      CAR_TYPE_INFO_URL: http://car-type-info-service:8080
      INVENTORY_URL: http://inventory-service:8080
      PRICING_URL: http://pricing-service:8080
      # Search events go straight to Kafka, without waiting; Kafka need not be up first.
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      keycloak:
        condition: service_healthy
      location-info-service:
        condition: service_healthy
      car-type-info-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      pricing-service:
        condition: service_healthy

  customer-service:
    build:
      context: .
      dockerfile: services/customer-service/app/Dockerfile
    environment:
      <<: *token-checks
      DB_URL: jdbc:postgresql://postgres:5432/customer
      DB_USER: customer
      DB_PASSWORD: ${CUSTOMER_DB_PASSWORD:?Set CUSTOMER_DB_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy

  pricing-service:
    build:
      context: .
      dockerfile: services/pricing-service/app/Dockerfile
    environment:
      <<: *token-checks
      CAR_RENTAL_SECURITY_CLIENT_ID: pricing-service
      CAR_RENTAL_SECURITY_CLIENT_SECRET: ${PRICING_SERVICE_CLIENT_SECRET:?Set PRICING_SERVICE_CLIENT_SECRET in .env}
      DB_URL: jdbc:postgresql://postgres:5432/pricing
      DB_USER: pricing
      DB_PASSWORD: ${PRICING_DB_PASSWORD:?Set PRICING_DB_PASSWORD in .env}
      PRICING_SEED_DATA: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ADMINISTRATION_URL: http://administration-service:8080
      # The services a quote depends on. They are called per request, so they need not be up first.
      LOCATION_INFO_URL: http://location-info-service:8080
      CUSTOMER_URL: http://customer-service:8080
      INSURANCE_URL: http://insurance-service:8080
      ANCILLARY_URL: http://ancillary-service:8080
      DISCOUNT_URL: http://discount-service:8080
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      administration-service:
        condition: service_healthy

  ancillary-service:
    build:
      context: .
      dockerfile: services/ancillary-service/app/Dockerfile
    environment:
      <<: *token-checks
      CAR_RENTAL_SECURITY_CLIENT_ID: ancillary-service
      CAR_RENTAL_SECURITY_CLIENT_SECRET: ${ANCILLARY_SERVICE_CLIENT_SECRET:?Set ANCILLARY_SERVICE_CLIENT_SECRET in .env}
      DB_URL: jdbc:postgresql://postgres:5432/ancillary
      DB_USER: ancillary
      DB_PASSWORD: ${ANCILLARY_DB_PASSWORD:?Set ANCILLARY_DB_PASSWORD in .env}
      ANCILLARY_SEED_DATA: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ADMINISTRATION_URL: http://administration-service:8080
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      administration-service:
        condition: service_healthy

  discount-service:
    build:
      context: .
      dockerfile: services/discount-service/app/Dockerfile
    environment:
      <<: *token-checks
      CAR_RENTAL_SECURITY_CLIENT_ID: discount-service
      CAR_RENTAL_SECURITY_CLIENT_SECRET: ${DISCOUNT_SERVICE_CLIENT_SECRET:?Set DISCOUNT_SERVICE_CLIENT_SECRET in .env}
      DB_URL: jdbc:postgresql://postgres:5432/discount
      DB_USER: discount
      DB_PASSWORD: ${DISCOUNT_DB_PASSWORD:?Set DISCOUNT_DB_PASSWORD in .env}
      DISCOUNT_SEED_DATA: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ADMINISTRATION_URL: http://administration-service:8080
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      administration-service:
        condition: service_healthy

  insurance-service:
    build:
      context: .
      dockerfile: services/insurance-service/app/Dockerfile
    environment:
      <<: *token-checks
      CAR_RENTAL_SECURITY_CLIENT_ID: insurance-service
      CAR_RENTAL_SECURITY_CLIENT_SECRET: ${INSURANCE_SERVICE_CLIENT_SECRET:?Set INSURANCE_SERVICE_CLIENT_SECRET in .env}
      DB_URL: jdbc:postgresql://postgres:5432/insurance
      DB_USER: insurance
      DB_PASSWORD: ${INSURANCE_DB_PASSWORD:?Set INSURANCE_DB_PASSWORD in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ADMINISTRATION_URL: http://administration-service:8080
      INSURANCE_PROVIDER_URL: http://insurance-provider-mock:8080
      INSURANCE_PROVIDER_API_KEY: ${INSURANCE_PROVIDER_API_KEY:?Set INSURANCE_PROVIDER_API_KEY in .env}
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      administration-service:
        condition: service_healthy
      insurance-provider-mock:
        condition: service_healthy

  # Stands in for the third-party insurance pricing service.
  insurance-provider-mock:
    build:
      context: .
      dockerfile: services/insurance-provider-mock/Dockerfile
    environment:
      INSURANCE_PROVIDER_API_KEY: ${INSURANCE_PROVIDER_API_KEY:?Set INSURANCE_PROVIDER_API_KEY in .env}

  ui:
    build:
      context: ui
    ports:
      - "8080:8080"
    depends_on:
      gateway:
        condition: service_healthy

  admin-ui:
    build:
      context: admin-ui
    ports:
      - "8090:8080"
    depends_on:
      admin-gateway:
        condition: service_healthy

  # HTTPS in front of the UIs and Keycloak, started only with the profile "https". Its certificate
  # comes from infra/https/make-certs.sh.
  https-proxy:
    image: caddy:2.10-alpine
    profiles: [https]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    volumes:
      - ./infra/https/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./infra/https/certs:/certs:ro
    ports:
      - "8443:8443"
      - "9443:9443"
      - "8543:8543"
    depends_on:
      ui:
        condition: service_healthy
      admin-ui:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/app/Dockerfile
    environment:
      <<: *token-checks
      CAR_RENTAL_SECURITY_CLIENT_ID: inventory-service
      CAR_RENTAL_SECURITY_CLIENT_SECRET: ${INVENTORY_SERVICE_CLIENT_SECRET:?Set INVENTORY_SERVICE_CLIENT_SECRET in .env}
      DB_URL: jdbc:postgresql://postgres:5432/inventory
      DB_USER: inventory
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?Set INVENTORY_DB_PASSWORD in .env}
      INVENTORY_SEED_DATA: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ADMINISTRATION_URL: http://administration-service:8080
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      administration-service:
        condition: service_healthy

  reservation-service:
    build:
      context: .
      dockerfile: services/reservation-service/app/Dockerfile
    environment:
      <<: *token-checks
      CAR_RENTAL_SECURITY_CLIENT_ID: reservation-service
      CAR_RENTAL_SECURITY_CLIENT_SECRET: ${RESERVATION_SERVICE_CLIENT_SECRET:?Set RESERVATION_SERVICE_CLIENT_SECRET in .env}
      DB_URL: jdbc:postgresql://postgres:5432/reservation
      DB_USER: reservation
      DB_PASSWORD: ${RESERVATION_DB_PASSWORD:?Set RESERVATION_DB_PASSWORD in .env}
      INVENTORY_URL: http://inventory-service:8080
      # The price is asked per reservation, so the pricing service need not be up first.
      PRICING_URL: http://pricing-service:8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ADMINISTRATION_URL: http://administration-service:8080
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
      administration-service:
        condition: service_healthy

volumes:
  postgres-data:
  kafka-data:
