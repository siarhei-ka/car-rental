name: UI

on:
  push:
    branches: [main]
    paths:
      - "admin-ui/**"
      - "ui/**"
      - "services/**/openapi.yaml"
      - ".github/workflows/ui.yml"
  pull_request:
    paths:
      - "admin-ui/**"
      - "ui/**"
      - "services/**/openapi.yaml"
      - ".github/workflows/ui.yml"

permissions:
  contents: read

jobs:
  frontend:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        app: [admin-ui, ui]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Check that the API types match the OpenAPI descriptions
        run: |
          npm run generate
          git diff --exit-code -- src/api/generated
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
