name: End to end

# Starts the whole system with Docker Compose and runs the Playwright tests of both UIs, on a
# desktop and a phone viewport (NFR-37).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Create .env with random secrets
        run: |
          python3 - <<'EOF'
          import secrets
          lines = []
          for line in open(".env.example"):
              line = line.rstrip("\n")
              if "=" in line and not line.startswith("#"):
                  key, value = line.split("=", 1)
                  if value == "change-me":
                      value = secrets.token_urlsafe(24)
                  line = f"{key}={value}"
              lines.append(line)
          open(".env", "w").write("\n".join(lines) + "\n")
          EOF
          grep -v '^#' .env | grep '=.' | cut -d= -f2- | while read -r secret; do
            echo "::add-mask::$secret"
          done

      - name: Start the system
        run: >-
          docker compose -f compose.yaml -f compose.ci.yaml up -d --build --wait
          --wait-timeout 1200

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Check types and formatting
        working-directory: e2e
        run: |
          npm run typecheck
          npm run format:check

      - name: Run the tests
        working-directory: e2e
        run: |
          set -a
          . ../.env
          set +a
          npm test

      - name: Save the logs of the services
        if: failure()
        run: docker compose logs --no-color > compose.log

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: |
            e2e/playwright-report
            e2e/test-results
            compose.log
          retention-days: 7

      - name: Stop the system
        if: always()
        run: docker compose down -v
