openapi: 3.1.0
info:
  title: Pricing Service
  version: 0.1.0
  description: |
    Daily rental rates per location, car type and car class, and the final price of a rental.
    There is one current rate for each combination, in the currency of the country. A car without
    a rate cannot be priced, so the search does not offer it.

    The final price is a quote with every line, the discount and the total: the car at its daily
    rate, the insurance for the driver, the extras, the one-way fee and the best discount. Every
    price comes from the service that owns it; a price sent by a browser is never used. A quote
    reserves nothing and is not stored.

    Every request names its country in the `X-Country` header and needs an access token. The list
    prices are open to every valid token, including the customer gateway's token for a visitor.
    The final price is only for a signed-in customer, because the insurance depends on the driver,
    and for other services that act for a customer.
    The admin paths are for administrators of the country.

    Amounts are decimal strings with as many fraction digits as the currency has minor units.

    Every response carries an `X-Correlation-Id` header. A caller may send its own.
servers:
  - url: /
security:
  - bearer: []
tags:
  - name: list-prices
    description: Public daily rates
  - name: quotes
    description: The final price, for a signed-in customer
  - name: admin
    description: Daily rates, for administrators of the country

paths:
  /api/v1/rates:
    get:
      tags: [list-prices]
      summary: List the daily rates of a location
      parameters:
        - $ref: "#/components/parameters/Country"
        - name: locationId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "200":
          description: The rates of the location, ordered by car type and class
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rate"
        "400":
          $ref: "#/components/responses/Problem"

  /api/v1/admin/rates:
    get:
      tags: [admin]
      summary: List the daily rates of the country
      parameters:
        - $ref: "#/components/parameters/Country"
        - name: locationId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "200":
          description: The rates, ordered by location, car type and class
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rate"

  /api/v1/admin/rates/{locationId}/{carType}/{carClass}:
    put:
      tags: [admin]
      summary: Set the daily rate of a car type and class at a location
      parameters:
        - $ref: "#/components/parameters/Country"
        - name: locationId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
        - name: carType
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Code"
        - name: carClass
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Code"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  $ref: "#/components/schemas/Amount"
      responses:
        "200":
          description: The saved rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rate"
        "400":
          $ref: "#/components/responses/Problem"

  /api/v1/quotes:
    post:
      tags: [quotes]
      summary: Calculate the final price
      description: |
        For the signed-in customer, whose driver profile prices the insurance. The rental follows
        the rules of a reservation: a start in the future, 1 to 30 days, a return location in the
        same country, and a driver at least 21 years old on the start day in the time zone of the
        pick-up location. A discount rule is valid on the day of the calculation.
      parameters:
        - $ref: "#/components/parameters/Country"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequest"
      responses:
        "200":
          description: The quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          description: >-
            An invalid request (`/problems/invalid-quote`, `/problems/invalid-price`,
            `/problems/unknown-country`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The customer has no driver profile yet (`/problems/profile-required`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: >-
            The rental is not offered as asked (`/problems/driver-too-young`,
            `/problems/car-not-offered`, `/problems/one-way-not-offered`,
            `/problems/location-not-offered`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: >-
            A service the price depends on did not answer in time (`/problems/price-unavailable`).
            No price is invented
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/customers/{customerId}/quotes:
    post:
      tags: [quotes]
      summary: Calculate the final price for a customer
      description: |
        The same calculation for a customer that another service acts for, such as the reservation
        service. Only for other services (role `service`).
      parameters:
        - $ref: "#/components/parameters/Country"
        - name: customerId
          in: path
          required: true
          description: The ID of the user in Keycloak
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequest"
      responses:
        "200":
          description: The quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          description: An invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The customer has no driver profile yet (`/problems/profile-required`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The rental is not offered as asked
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: A service the price depends on did not answer in time
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Country:
      name: X-Country
      in: header
      required: true
      schema:
        type: string
        pattern: "^[a-z]{2}$"
        examples: ["pl"]
  responses:
    Problem:
      description: An invalid request or price (`/problems/invalid-price`, `/problems/unknown-country`)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Id:
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
    Code:
      type: string
      pattern: "^[A-Z][A-Z0-9_]{0,31}$"
    Amount:
      type: string
      description: A decimal amount in the currency of the country, more than zero
      examples: ["149.00"]
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          $ref: "#/components/schemas/Amount"
        currency:
          type: string
          description: ISO 4217 code
          examples: ["PLN"]
    Rate:
      type: object
      required: [locationId, carType, carClass, dailyRate]
      properties:
        locationId:
          $ref: "#/components/schemas/Id"
        carType:
          $ref: "#/components/schemas/Code"
        carClass:
          $ref: "#/components/schemas/Code"
        dailyRate:
          $ref: "#/components/schemas/Money"
    QuoteRequest:
      type: object
      required: [pickUpLocationId, start, days, carType, carClass, insurance]
      properties:
        pickUpLocationId:
          $ref: "#/components/schemas/Id"
        returnLocationId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
          description: The return location, or none for the pick-up location
        start:
          type: string
          format: date-time
          examples: ["2026-12-24T09:00:00Z"]
        days:
          type: integer
          minimum: 1
          maximum: 30
        carType:
          $ref: "#/components/schemas/Code"
        carClass:
          $ref: "#/components/schemas/Code"
        insurance:
          type: string
          description: The code of the insurance option
          examples: ["BASIC"]
        extras:
          type: array
          items:
            type: object
            required: [code, quantity]
            properties:
              code:
                $ref: "#/components/schemas/Code"
              quantity:
                type: integer
                minimum: 1
    Quote:
      type: object
      required: [currency, lines, subtotal, total]
      properties:
        currency:
          type: string
          description: ISO 4217 code of the country of the pick-up location
        lines:
          type: array
          items:
            $ref: "#/components/schemas/QuoteLine"
        subtotal:
          $ref: "#/components/schemas/Money"
        discount:
          oneOf:
            - type: object
              required: [name, amount]
              properties:
                name:
                  type: string
                amount:
                  $ref: "#/components/schemas/Money"
            - type: "null"
          description: The one rule that saves the most, or none
        total:
          $ref: "#/components/schemas/Money"
    QuoteLine:
      type: object
      required: [kind, name, quantity, unitPrice, charge, amount]
      properties:
        kind:
          type: string
          enum: [CAR_RENTAL, INSURANCE, EXTRA, ONE_WAY_FEE]
        code:
          type: [string, "null"]
          description: >-
            The car type and class (`SEDAN/ECONOMY`), the insurance option or the extra; none for
            the one-way fee
        name:
          type: string
        quantity:
          type: integer
        unitPrice:
          $ref: "#/components/schemas/Money"
        charge:
          type: string
          enum: [PER_DAY, PER_RENTAL]
        amount:
          $ref: "#/components/schemas/Money"
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
