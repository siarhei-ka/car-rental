# Settings shared by both gateways. Run with the profile "customer" or "admin".
spring:
  application:
    name: api-gateway
  lifecycle:
    timeout-per-shutdown-phase: 20s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  shutdown: graceful
  # The UI's web server passes requests on. Its forwarded headers tell the gateway the address the
  # browser used, which the sign-in needs for the return address.
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs

gateway:
  keycloak:
    public-url: ${KEYCLOAK_PUBLIC_URL:http://localhost:8180}
    internal-url: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}
    realm: car-rental
    client-secret: ${GATEWAY_CLIENT_SECRET}
