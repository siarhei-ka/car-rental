spring:
  application:
    name: cache-updater
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs

cache-updater:
  administration-url: ${ADMINISTRATION_URL:http://localhost:8083}
  administration-timeout: PT5S
  topic: reference-data
  # How often the cache is checked, and reloaded if Redis has lost its data.
  reload-check: PT30S
