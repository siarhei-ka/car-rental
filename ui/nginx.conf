# Serves the customer UI and passes the API, sign-in and sign-out to its gateway, so the browser talks to
# one address and needs no CORS.

# Behind the HTTPS proxy, the scheme the browser used comes from the proxy; otherwise it is this
# server's own.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # The gateway is resolved when a request arrives, so nginx starts even if it is not up yet.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $gateway http://gateway:8080;

  # The gateway needs the address the browser used, for the return address after sign-in.
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  location /api/ {
    proxy_pass $gateway;
  }

  location /oauth2/ {
    proxy_pass $gateway;
  }

  location /login/oauth2/ {
    proxy_pass $gateway;
  }

  location = /logout {
    proxy_pass $gateway;
  }

  location = /healthz {
    access_log off;
    return 200 "ok";
  }

  # Single-page application: unknown paths load the app, which routes in the browser.
  location / {
    try_files $uri /index.html;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
